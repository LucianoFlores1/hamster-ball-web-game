<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14051f" />
  <title>ZipZapp</title>
  <meta name="description" content="ZipZapp: a one-tap neon arcade game. Dodge at the last second to multiply your score." />
  <link rel="stylesheet" href="./src/ui/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="ZipZapp"></canvas>
    <div id="vignette"></div>
    <div id="flash"></div>
    <div id="banner"></div>

    <div id="hud" class="hidden">
      <div id="score">0</div>
      <div id="mult" class="level-0">
        <span id="mult-value">x1</span>
        <div id="mult-bar"><div id="mult-fill"></div></div>
      </div>
      <div id="graze-pop"></div>
    </div>

    <div id="menu" class="screen hidden">
      <h1 class="title"><span class="t1">ZIP</span><span class="t2">ZAPP</span></h1>
      <div class="tagline">DODGE LATE · SCORE BIG</div>
      <div class="best-line">★ <span id="menu-best">0</span></div>
      <div class="hint">
        <div class="tap-icon" aria-hidden="true">👆</div>
        <div class="hint-text">TAP TO PLAY</div>
      </div>
    </div>

    <div id="paused" class="screen hidden">
      <div class="big-icon" aria-hidden="true">⏸</div>
      <div class="hint-text">TAP TO RESUME</div>
    </div>

    <div id="over" class="screen hidden">
      <div id="over-new" class="new-best hidden">★ NEW BEST ★</div>
      <div id="over-score" class="over-score">0</div>
      <div class="best-line">★ <span id="over-best">0</span></div>
      <div class="buttons">
        <button id="btn-continue" class="btn btn-continue hidden" aria-label="Watch an ad to continue">
          <span aria-hidden="true">▶︎</span><span class="btn-sub">AD · CONTINUE</span>
        </button>
        <button id="btn-replay" class="btn btn-replay" aria-label="Play again">
          <span aria-hidden="true">↻</span>
        </button>
      </div>
    </div>

    <div id="ad-wait" class="screen hidden">
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <button id="btn-mute" class="btn-mute" aria-label="Mute">🔊</button>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
